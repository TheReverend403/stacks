---
services:
  vaultwarden:
    image: "vaultwarden/server:latest"
    container_name: "vaultwarden"
    restart: "unless-stopped"
    init: true
    read_only: true
    user: "${VAULTWARDEN_PUID:-${PUID:-1000}}:${VAULTWARDEN_PGID:-${PGID:-1000}}"
    depends_on:
      db-18:
        condition: "service_healthy"
    env_file:
      - path: ".env"
        required: false
      - path: "stack.env"
        required: false
    environment:
      TZ: "${TZ:-UTC}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-vaultwarden}:${POSTGRES_PASSWORD:-vaultwarden}@/${POSTGRES_DB:-vaultwarden}?host=${POSTGRES_HOST:-/run/postgresql}}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?}"
    volumes:
      - "postgres_18_socket:/run/postgresql"
      - "${BASE_DIR:-.}/data/vaultwarden:/data"
    networks:
      - "vaultwarden"
    deploy:
      resources:
        limits:
          cpus: "${VAULTWARDEN_CPU_LIMIT:-${CPU_LIMIT:-0}}"
          memory: "${VAULTWARDEN_MEM_LIMIT:-${MEM_LIMIT:-0}}"
    healthcheck:
      test:
        - "CMD"
        - "/healthcheck.sh"
      start_period: "10s"
      start_interval: "1s"
      interval: "10s"
      timeout: "5s"

  db-18:
    image: "postgres:18"
    container_name: "vaultwarden_db_18"
    restart: "unless-stopped"
    init: true
    user: "${POSTGRES_PUID:-${PUID:-1000}}:${POSTGRES_PGID:-${PGID:-1000}}"
    network_mode: "none"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_HOST: "${POSTGRES_HOST:-/run/postgresql}"
      POSTGRES_DB: "${POSTGRES_DB:-vaultwarden}"
      POSTGRES_USER: "${POSTGRES_USER:-vaultwarden}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vaultwarden}"
    volumes:
      - "${BASE_DIR:-.}/data/db:/var/lib/postgresql"
      - "${BASE_DIR:-.}/config/db:/etc/postgresql"
      - "postgres_18_socket:/run/postgresql"
    tmpfs:
      - "/run"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -q --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER --host=$$POSTGRES_HOST"
      start_period: "10s"
      start_interval: "1s"
      interval: "10s"
      timeout: "5s"
    shm_size: "${SHM_SIZE:-512M}"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-${CPU_LIMIT:-0}}"
          memory: "${POSTGRES_MEM_LIMIT:-${MEM_LIMIT:-0}}"

volumes:
  postgres_18_socket:

networks:
  vaultwarden:
    name: "vaultwarden"
